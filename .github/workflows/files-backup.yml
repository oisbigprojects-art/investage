# Har kuni Storage fayllari zaxirasi: logotip, startap hujjatlari va videolar yuklab olinadi, shifrlanib 30 kun saqlanadi.
# Repo ochiq, shuning uchun fayl nomlari loglarga chiqarilmaydi va shifrlanmagan fayl yuklanmaydi.
# Tiklash yo'riqnomasi: supabase/zaxira-tiklash.md
name: Fayllar zaxirasi

on:
  schedule:
    - cron: '30 21 * * *' # Toshkent vaqti bilan 02:30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RCLONE_CONFIG_SB_TYPE: s3
      RCLONE_CONFIG_SB_PROVIDER: Other
      RCLONE_CONFIG_SB_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_KEY_ID }}
      RCLONE_CONFIG_SB_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET }}
      RCLONE_CONFIG_SB_REGION: eu-central-1
      RCLONE_CONFIG_SB_ENDPOINT: https://fuklumjbymmkaflzndxp.storage.supabase.co/storage/v1/s3
      RCLONE_CONFIG_SB_FORCE_PATH_STYLE: 'true'
    steps:
      - name: Fayllarni yuklab olish
        run: |
          sudo apt-get install -y -qq rclone > /dev/null
          mkdir -p files/docs files/logos files/videos
          # Fayl nomlari loglarga chiqmaydi: xatoda faqat soni va sababi ko'rinadi
          for bucket in docs logos videos; do
            if ! rclone copy "SB:$bucket" "files/$bucket" --multi-thread-streams 0 --log-level ERROR 2> sync.err; then
              echo "$bucket: $(wc -l < sync.err) ta xato"
              sed -E 's#^[0-9/]+ [0-9:]+ ##; s#[0-9a-f-]{36}[^ :]*#<fayl>#g' sync.err | sort -u | head -5
              exit 1
            fi
          done
          echo "Yuklandi: $(find files -type f | wc -l) ta fayl"

      - name: Shifrlash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ "${#BACKUP_PASSPHRASE}" -lt 32 ]; then echo "BACKUP_PASSPHRASE juda qisqa"; exit 1; fi
          tar -czf files.tar.gz files
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output investage-files.tar.gz.gpg files.tar.gz
          rm -rf files files.tar.gz

      - name: Saqlash
        uses: actions/upload-artifact@v4
        with:
          name: investage-files-${{ github.run_number }}
          path: investage-files.tar.gz.gpg
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
