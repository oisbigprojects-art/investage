<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<!-- Investage Reels 2.0 shabloni. render2.py ochadi, build(spec) chaqiradi va har kadr uchun seek(ms) qiladi.
     Barcha harakatlar Web Animations API orqali, to'xtatilgan holda: vaqtni kadrma-kadr aniq boshqarish mumkin. -->
<style>
@font-face { font-family: 'Manrope'; src: url('fonts/Manrope.ttf') format('truetype'); font-weight: 200 800; }
@font-face { font-family: 'Inter'; src: url('fonts/Inter.ttf') format('truetype'); font-weight: 100 900; }
:root { --gold: #F5BF17; --gold2: #FFD95A; --bg: #0B0B0A; --ink: #F5F5F3; --muted: #A3A39B; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
body { font-family: 'Manrope', sans-serif; color: var(--ink); position: relative; }
.stage { position: absolute; inset: 0; overflow: hidden; }

/* Fon: harakatlanuvchi nurlar, to'r, donachalar */
.blob { position: absolute; border-radius: 50%; filter: blur(140px); opacity: .55; }
.b1 { width: 900px; height: 900px; background: radial-gradient(circle, rgba(245,191,23,.55), rgba(245,191,23,0) 70%); left: -200px; top: 300px; }
.b2 { width: 800px; height: 800px; background: radial-gradient(circle, rgba(255,140,40,.35), rgba(255,140,40,0) 70%); right: -260px; top: 1000px; }
.b3 { width: 700px; height: 700px; background: radial-gradient(circle, rgba(245,191,23,.25), rgba(245,191,23,0) 70%); left: 300px; top: -200px; }
.grid { position: absolute; inset: -120px; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 120px 120px; mask-image: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 75%); }
.grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay; }
.dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 16px var(--gold); }

/* Yuqori qism */
.bars { position: absolute; left: 80px; right: 80px; top: 90px; display: flex; gap: 14px; z-index: 5; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; transform: scaleX(0); }
.logo { position: absolute; left: 80px; top: 140px; height: 60px; z-index: 5; filter: brightness(0) invert(1); }
.handle { position: absolute; right: 80px; top: 152px; font: 600 34px 'Inter'; color: var(--muted); z-index: 5; }

/* Sahnalar */
.scene { position: absolute; inset: 0; padding: 0 80px; display: flex; flex-direction: column; justify-content: center; }
.eyebrow { align-self: flex-start; display: inline-flex; align-items: center; gap: 16px; font: 700 38px 'Inter'; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); border: 2px solid rgba(245,191,23,.45); border-radius: 999px; padding: 14px 30px; margin-bottom: 48px; background: rgba(245,191,23,.08); }
.eyebrow .pulse { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(245,191,23,.6); }
.title { font-weight: 800; letter-spacing: -.02em; line-height: 1.04; }
.t-xl { font-size: 118px; }
.t-l { font-size: 104px; }
.t-m { font-size: 84px; }
.w { display: inline-block; white-space: pre; position: relative; }
.w .mk { position: absolute; left: -14px; right: 2px; top: 10%; bottom: -4%; background: var(--gold); border-radius: 14px; z-index: -1; transform-origin: left; transform: scaleX(0); }
.w.hl { color: #141412; }
.body { font: 500 54px/1.32 'Inter'; color: var(--muted); margin-top: 44px; max-width: 900px; }
.numwrap { position: relative; align-self: flex-start; margin-bottom: 30px; }
.num { font-weight: 800; font-size: 300px; line-height: .9; letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 4px var(--gold); }
.numfill { position: absolute; left: 0; top: 0; font-weight: 800; font-size: 300px; line-height: .9; letter-spacing: -.04em; color: var(--gold); clip-path: inset(100% 0 0 0); }
.ring { position: absolute; right: -170px; top: 10px; width: 150px; height: 150px; }
.ring circle { fill: none; stroke: var(--gold); stroke-width: 6; stroke-linecap: round; }
.uline { height: 14px; width: 420px; background: var(--gold); border-radius: 8px; margin-top: 26px; transform-origin: left; transform: scaleX(0); }
.stat { font-weight: 800; font-size: 250px; line-height: .95; letter-spacing: -.04em; color: var(--gold); margin-bottom: 20px; }

/* CTA: telefon brauzeri kartasi */
.card { margin-top: 60px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.12); border-radius: 44px; padding: 34px; backdrop-filter: blur(10px); }
.url { display: flex; align-items: center; gap: 20px; background: rgba(0,0,0,.45); border-radius: 26px; padding: 26px 30px; font: 600 50px 'Inter'; color: var(--ink); }
.url .lock { width: 30px; height: 36px; border: 5px solid var(--gold); border-radius: 8px; position: relative; flex: none; }
.caret { display: inline-block; width: 4px; height: 52px; background: var(--gold); margin-left: 4px; vertical-align: middle; }
.btn { margin-top: 30px; display: flex; justify-content: center; align-items: center; height: 150px; border-radius: 80px; background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #141412; font: 800 66px 'Manrope'; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(245,191,23,.35); }
.ripple { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,.7); transform: scale(0); }
.cursor { position: absolute; width: 90px; height: 90px; z-index: 6; opacity: 0; }
.note { margin-top: 40px; font: 600 46px 'Inter'; color: var(--ink); display: flex; align-items: center; gap: 18px; }
.note b { color: var(--gold); }

/* Qo'shimcha harakat: kamera, orqa fondagi katta yozuv, yaltiroq nur, portlash zarralari, chaqnash */
.cam { width: 100%; display: flex; flex-direction: column; transform-origin: 30% 50%; }
.marquee { position: absolute; top: 1420px; left: 0; white-space: nowrap; font: 800 330px 'Manrope'; letter-spacing: -.02em; color: transparent; -webkit-text-stroke: 3px rgba(245,191,23,.13); }
.marquee2 { top: 260px; -webkit-text-stroke: 3px rgba(255,255,255,.05); }
.title { position: relative; }
.shine { position: absolute; top: -10%; bottom: -10%; width: 260px; left: 0; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); mix-blend-mode: overlay; transform: translateX(-400px) skewX(-18deg); pointer-events: none; }
.spark { position: absolute; left: 540px; top: 960px; width: 14px; height: 14px; border-radius: 50%; background: var(--gold2); box-shadow: 0 0 24px var(--gold); z-index: 21; opacity: 0; }
.flash { position: absolute; inset: 0; background: #fff; z-index: 22; opacity: 0; mix-blend-mode: overlay; }

/* Sahnalar orasidagi oltin parda */
.wipe { position: absolute; inset: -10% -20%; background: linear-gradient(100deg, var(--gold) 0%, var(--gold2) 60%, var(--gold) 100%); z-index: 20; transform: translateX(-130%) skewX(-12deg); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="grid" id="grid"></div>
  <div class="blob b1" id="b1"></div><div class="blob b2" id="b2"></div><div class="blob b3" id="b3"></div>
  <div class="marquee" id="mq1">INVESTAGE · STARTAP · INVESTOR · INVESTAGE · STARTAP · INVESTOR ·</div>
  <div class="marquee marquee2" id="mq2">INVESTOR · STARTAP · INVESTAGE · INVESTOR · STARTAP · INVESTAGE ·</div>
  <div id="dots"></div>
  <svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="bars" id="bars"></div>
  <img class="logo" src="../../public/logo.webp" alt="">
  <div class="handle">@investageuz</div>
  <div id="scenes"></div>
</div>
<script>
const ANIMS = [];      // to'xtatilgan WAAPI animatsiyalari
const TICKS = [];      // har kadrda matnni o'zgartiradigan funksiyalar (sanash, yozish)
let DURATION = 0;
const E_OUT = 'cubic-bezier(.16,1,.3,1)';
const E_BACK = 'cubic-bezier(.34,1.56,.64,1)';
const E_INOUT = 'cubic-bezier(.65,0,.35,1)';

function anim(el, keyframes, start, dur, easing = E_OUT, extra = {}) {
  const a = el.animate(keyframes, { duration: dur, delay: start, fill: 'both', easing, ...extra });
  a.pause(); ANIMS.push(a); return a;
}
function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function rnd(seed) { let x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

// Matnni so'zlarga bo'lib, har birini alohida span qiladi; highlight so'zlar oltin marker oladi
function words(container, text, highlight, cls) {
  const hl = (highlight || []).map(s => s.toLowerCase());
  const out = [];
  text.split(' ').forEach((w, i, arr) => {
    const clean = w.replace(/[?.,!:;«»"]/g, '').toLowerCase();
    const span = h('span', 'w' + (hl.includes(clean) ? ' hl' : '') + (cls ? ' ' + cls : ''));
    span.textContent = w + (i < arr.length - 1 ? ' ' : '');
    if (hl.includes(clean)) { const mk = h('span', 'mk'); span.prepend(mk); span._mk = mk; }
    container.appendChild(span); out.push(span);
  });
  return out;
}
// So'zlar pastdan, xiralikdan, ozgina burilib chiqadi
function revealWords(ws, start, step = 70, dur = 700) {
  ws.forEach((w, i) => {
    anim(w, [{ opacity: 0, transform: 'translateY(90px) rotate(5deg)', filter: 'blur(14px)' },
             { opacity: 1, transform: 'translateY(0) rotate(0)', filter: 'blur(0)' }], start + i * step, dur);
    if (w._mk) anim(w._mk, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], start + ws.length * step + 150, 450, E_INOUT);
  });
  return start + ws.length * step + dur;
}
// Sarlavha ustidan bir marta yaltiroq nur o'tadi
function shine(titleEl, at) {
  const s = h('div', 'shine'); titleEl.appendChild(s);
  anim(s, [{ transform: 'translateX(-400px) skewX(-18deg)' }, { transform: 'translateX(1200px) skewX(-18deg)' }], at, 1100, E_INOUT);
}
// Sahna boshida markazdan zarralar portlaydi va ekran bir lahza chaqnaydi
function burst(at, seed) {
  const root = document.getElementById('stage');
  const fl = h('div', 'flash'); root.appendChild(fl);
  anim(fl, [{ opacity: 0 }, { opacity: .35, offset: .3 }, { opacity: 0 }], at, 260, 'linear');
  for (let i = 0; i < 16; i++) {
    const sp = h('div', 'spark'); root.appendChild(sp);
    const ang = (i / 16) * Math.PI * 2 + rnd(seed + i) * .4, dist = 380 + rnd(seed * 3 + i) * 420;
    anim(sp, [{ opacity: 1, transform: 'translate(0,0) scale(1.4)' }, { opacity: 0, transform: `translate(${Math.cos(ang) * dist}px,${Math.sin(ang) * dist}px) scale(.2)` }], at, 900 + rnd(i) * 300, E_OUT, { fill: 'forwards' });
  }
}
function sceneExit(sc, s1) {
  anim(sc, [{ opacity: 1, transform: 'scale(1)', filter: 'blur(0)' }, { opacity: 0, transform: 'scale(1.06)', filter: 'blur(10px)' }], s1 - 380, 320, 'ease-in');
}

function buildHook(sc, s, t0) {
  if (s.eyebrow) {
    const eb = h('div', 'eyebrow', '<span class="pulse"></span>' + esc(s.eyebrow)); sc.appendChild(eb);
    anim(eb, [{ opacity: 0, transform: 'translateY(-30px) scale(.9)' }, { opacity: 1, transform: 'none' }], t0 + 100, 600, E_BACK);
    anim(eb.firstChild, [{ boxShadow: '0 0 0 0 rgba(245,191,23,.7)' }, { boxShadow: '0 0 0 22px rgba(245,191,23,0)' }], t0 + 600, 1100, 'ease-out', { iterations: 4 });
  }
  const t = h('div', 'title t-xl'); sc.appendChild(t);
  const end = revealWords(words(t, s.title, s.highlight), t0 + 350, 90, 750);
  shine(t, end + 200);
}
function buildPoint(sc, s, t0) {
  const nw = h('div', 'numwrap');
  nw.appendChild(h('div', 'num', esc(s.num)));
  const fill = h('div', 'numfill', esc(s.num)); nw.appendChild(fill);
  const ring = h('div'); ring.innerHTML = '<svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="66" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>';
  nw.appendChild(ring.firstChild); sc.appendChild(nw);
  anim(nw, [{ opacity: 0, transform: 'translateX(-120px)' }, { opacity: 1, transform: 'none' }], t0, 700);
  anim(fill, [{ clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0 0 0 0)' }], t0 + 450, 800, E_INOUT);
  anim(nw.querySelector('circle'), [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], t0 + 300, 1100, E_INOUT);
  const t = h('div', 'title ' + (s.title.length > 14 ? 't-m' : 't-l')); sc.appendChild(t);
  const end = revealWords(words(t, s.title, s.highlight), t0 + 350, 80);
  const ul = h('div', 'uline'); sc.appendChild(ul);
  anim(ul, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], end - 200, 600, E_INOUT);
  if (s.body) { const b = h('div', 'body'); sc.appendChild(b); revealWords(words(b, s.body), end + 100, 45, 600); }
}
function buildStat(sc, s, t0) {
  const m = String(s.value).match(/^([^0-9]*)([0-9]+(?:[.,][0-9]+)?)(.*)$/);
  const st = h('div', 'stat', esc(s.value)); sc.appendChild(st);
  anim(st, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], t0, 700, E_BACK);
  if (m) {
    const target = parseFloat(m[2].replace(',', '.')), dec = (m[2].split(/[.,]/)[1] || '').length;
    TICKS.push(ms => { const p = Math.min(1, Math.max(0, (ms - t0) / 1400)); const e = 1 - Math.pow(1 - p, 3);
      st.textContent = m[1] + (target * e).toFixed(dec).replace('.', m[2].includes(',') ? ',' : '.') + m[3]; });
  }
  const t = h('div', 'title t-m'); sc.appendChild(t);
  const end = revealWords(words(t, s.title, s.highlight), t0 + 500, 80);
  if (s.body) { const b = h('div', 'body'); sc.appendChild(b); revealWords(words(b, s.body), end, 45, 600); }
}
function buildQuote(sc, s, t0) {
  const q = h('div', 'num', '“'); q.style.fontSize = '360px'; q.style.lineHeight = '.6'; sc.appendChild(q);
  anim(q, [{ opacity: 0, transform: 'translateY(-60px)' }, { opacity: 1, transform: 'none' }], t0, 700, E_BACK);
  const t = h('div', 'title t-m'); sc.appendChild(t);
  const end = revealWords(words(t, s.title, s.highlight), t0 + 300, 80);
  if (s.body) { const b = h('div', 'body'); sc.appendChild(b); revealWords(words(b, s.body), end, 45, 600); }
}
function buildCta(sc, s, t0, t1) {
  const t = h('div', 'title t-l'); sc.appendChild(t);
  let end = revealWords(words(t, s.title, s.highlight), t0 + 150, 85);
  shine(t, end);
  const card = h('div', 'card');
  const url = h('div', 'url', '<span class="lock"></span><span class="typed"></span><span class="caret"></span>');
  const btn = h('div', 'btn', esc(s.buttonText || 'Ro‘yxatdan o‘tish'));
  const rip = h('span', 'ripple'); btn.appendChild(rip);
  card.appendChild(url); card.appendChild(btn); sc.appendChild(card);
  anim(card, [{ opacity: 0, transform: 'translateY(80px) scale(.96)' }, { opacity: 1, transform: 'none' }], end - 200, 700, E_BACK);
  const typed = url.querySelector('.typed'), caret = url.querySelector('.caret'), site = s.button || 'investage.uz';
  const typeStart = end + 300;
  TICKS.push(ms => { const n = Math.max(0, Math.min(site.length, Math.floor((ms - typeStart) / 55))); typed.textContent = site.slice(0, n);
    caret.style.opacity = (Math.floor(ms / 400) % 2 === 0 || n < site.length) ? 1 : 0; });
  const tapAt = typeStart + site.length * 55 + 500;
  const cur = h('div', 'cursor'); cur.innerHTML = '<svg viewBox="0 0 24 24" width="90" height="90"><path d="M5 2l14 9-6 1.5 3.5 7-3 1.5-3.5-7L5 18z" fill="#fff" stroke="#141412" stroke-width="1.2"/></svg>';
  document.getElementById('stage').appendChild(cur);
  anim(cur, [{ opacity: 0, left: '900px', top: '1700px' }, { opacity: 1, left: '640px', top: '1260px' }], tapAt - 700, 650, E_OUT);
  anim(cur, [{ transform: 'scale(1)' }, { transform: 'scale(.82)' }, { transform: 'scale(1)' }], tapAt, 300, 'ease-in-out');
  anim(btn, [{ transform: 'scale(1)' }, { transform: 'scale(.95)' }, { transform: 'scale(1)' }], tapAt, 320, 'ease-in-out');
  anim(rip, [{ transform: 'scale(0)', opacity: .8, left: '560px', top: '45px' }, { transform: 'scale(30)', opacity: 0, left: '560px', top: '45px' }], tapAt + 60, 900, 'ease-out');
  anim(btn, [{ boxShadow: '0 30px 80px rgba(245,191,23,.35)' }, { boxShadow: '0 30px 120px rgba(245,191,23,.7)' }, { boxShadow: '0 30px 80px rgba(245,191,23,.35)' }], tapAt + 300, 1400, 'ease-in-out', { iterations: 3 });
  anim(cur, [{ opacity: 1 }, { opacity: 0 }], t1 - 300, 300, 'ease-in', { fill: 'forwards' });
  if (s.note) {
    const n = h('div', 'note', '<b>✓</b> ' + esc(s.note)); sc.appendChild(n);
    anim(n, [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'none' }], tapAt + 500, 600);
  }
}

window.build = function (spec) {
  const scenes = spec.scenes; const bounds = []; let t = 0;
  scenes.forEach(s => { const d = Math.round((s.dur || 4.4) * 1000); bounds.push([t, t + d]); t += d; });
  DURATION = t;
  // Fon harakatlari butun video davomida
  anim(document.getElementById('b1'), [{ transform: 'translate(0,0)' }, { transform: 'translate(380px,260px)' }, { transform: 'translate(120px,-200px)' }], 0, DURATION, 'ease-in-out');
  anim(document.getElementById('b2'), [{ transform: 'translate(0,0)' }, { transform: 'translate(-420px,-300px)' }], 0, DURATION, 'ease-in-out');
  anim(document.getElementById('b3'), [{ transform: 'translate(0,0) scale(1)' }, { transform: 'translate(-200px,500px) scale(1.3)' }], 0, DURATION, 'ease-in-out');
  anim(document.getElementById('grid'), [{ transform: 'translateY(0)' }, { transform: 'translateY(120px)' }], 0, DURATION, 'linear');
  // Orqa fondagi katta yozuvlar qarama-qarshi tomonga suzadi; nurlar beat (100 BPM) ritmida "nafas oladi"
  anim(document.getElementById('mq1'), [{ transform: 'translateX(0)' }, { transform: 'translateX(-1400px)' }], 0, DURATION, 'linear');
  anim(document.getElementById('mq2'), [{ transform: 'translateX(-1400px)' }, { transform: 'translateX(0)' }], 0, DURATION, 'linear');
  ['b1', 'b3'].forEach((id, k) => anim(document.getElementById(id), [{ opacity: .4 }, { opacity: .8 }, { opacity: .4 }], k * 300, 1200, 'ease-in-out', { iterations: Infinity }));
  const dots = document.getElementById('dots');
  for (let i = 0; i < 26; i++) {
    const d = h('div', 'dot'); const x = rnd(i) * 1080, sz = 4 + rnd(i + 50) * 9; d.style.left = x + 'px'; d.style.top = '0'; d.style.width = d.style.height = sz + 'px';
    dots.appendChild(d); const sp = 6000 + rnd(i + 99) * 9000; const off = rnd(i + 7) * sp;
    anim(d, [{ transform: 'translate(0,2000px)', opacity: 0 }, { opacity: .9, offset: .2 }, { opacity: .9, offset: .8 }, { transform: `translate(${(rnd(i + 3) - .5) * 200}px,-100px)`, opacity: 0 }], -off, sp, 'linear', { iterations: Infinity });
  }
  // Progress chiziqlari
  const bars = document.getElementById('bars');
  bounds.forEach(([a, b]) => { const bar = h('div', 'bar'); const i = h('i'); bar.appendChild(i); bars.appendChild(bar);
    anim(i, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], a, b - a, 'linear'); });
  // Sahnalar
  const root = document.getElementById('scenes');
  scenes.forEach((s, idx) => {
    const [s0, s1] = bounds[idx]; const sc = h('div', 'scene'); root.appendChild(sc);
    const cam = h('div', 'cam'); sc.appendChild(cam);
    anim(sc, [{ visibility: 'hidden' }, { visibility: 'visible' }], s0, 1, 'step-end');
    if (idx < scenes.length - 1) { anim(sc, [{ visibility: 'visible' }, { visibility: 'hidden' }], s1, 1, 'step-end'); sceneExit(sc, s1); }
    // Kamera sahna davomida sekin yaqinlashadi va ozgina suriladi
    anim(cam, [{ transform: 'scale(1) translateY(0)' }, { transform: 'scale(1.07) translateY(-24px)' }], s0, s1 - s0, 'linear');
    ({ hook: buildHook, point: buildPoint, stat: buildStat, quote: buildQuote, cta: buildCta }[s.type])(cam, s, s0, s1);
    burst(s0 + (idx > 0 ? 40 : 250), idx * 17 + 3);
    if (idx > 0) { const w = h('div', 'wipe'); root.appendChild(w);
      anim(w, [{ transform: 'translateX(-130%) skewX(-12deg)' }, { transform: 'translateX(0) skewX(-12deg)', offset: .5 }, { transform: 'translateX(130%) skewX(-12deg)' }], s0 - 260, 620, E_INOUT); }
  });
  // Oxirgi kadrlarda hammasi sekin qorayadi
  anim(document.getElementById('stage'), [{ opacity: 1 }, { opacity: 0 }], DURATION - 500, 500, 'ease-in');
  return { duration: DURATION, bounds };
};
window.seek = function (ms) { for (const a of ANIMS) a.currentTime = ms; for (const f of TICKS) f(ms); };
</script>
</body>
</html>
